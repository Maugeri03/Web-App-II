server:
  port: ${CATALOGUE_SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: catalogue

  datasource:
    url: ${CATALOGUE_DB_URL:jdbc:postgresql://localhost:5432/catalogue}
    username: ${CATALOGUE_DB_USERNAME:catalogue}
    password: ${CATALOGUE_DB_PASSWORD:catalogue}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: catalogue-pool
      maximum-pool-size: ${CATALOGUE_DB_MAX_POOL_SIZE:10}
      connection-timeout: ${CATALOGUE_DB_CONN_TIMEOUT_MS:5000}

  sql:
    init:
      mode: never

  flyway:
    enabled: ${CATALOGUE_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true