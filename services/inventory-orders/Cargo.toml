[package]
name = "inventory-orders"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", features = ["runtime-tokio", "postgres", "macros", "migrate", "chrono"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
validator = "0.21.0"

[dev-dependencies]
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
tower = { version = "0.5.3", features = ["util"] }
